name: Compilar Musikverb VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar con CMake
        run: cmake -B build

      - name: Compilar (Release)
        run: cmake --build build --config Release --parallel

      - name: Guardar el plugin compilado
        uses: actions/upload-artifact@v4
        with:
          name: Musikverb-VST3-Windows
          path: build/*_artefacts/Release/VST3/*.vst3
