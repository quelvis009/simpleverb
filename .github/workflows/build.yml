name: Compilar SimpleVerb VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar con CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar (Release)
        run: cmake --build build --config Release --parallel

      - name: Guardar el plugin compilado
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVerb-VST3-Windows
          path: build/SimpleVerb_artefacts/Release/VST3/SimpleVerb.vst3
